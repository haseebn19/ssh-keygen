[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-keygen"
version = "2.1.0"
description = "A desktop application for generating SSH keys"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Haseeb Niazi", email = "haseeb.kn@outlook.com"}
]
dependencies = [
    "cryptography>=42.0.2",
    "PyQt6>=6.6.1",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/haseebn19/ssh-keygen"
Repository = "https://github.com/haseebn19/ssh-keygen.git"

[project.scripts]
ssh-keygen-gui = "ssh_keygen.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ssh_keygen = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]

[tool.coverage.run]
source = ["src/ssh_keygen"]
branch = true

[tool.coverage.report]
fail_under = 65
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["ssh_keygen"]
